    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    text-align: center !important;
    margin-bottom: 2.2rem !important;

    > .column {
      width: 100% !important;
      max-width: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      text-align: center !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    .quarto-figure,
    figure.figure,
    .quarto-figure-left {
      margin: 0 auto 0.85rem auto !important;
      text-align: center !important;
      display: flex !important;
      justify-content: center !important;
      float: none !important;
    }

    img.rounded,
    img[src*="people"] {
      margin: 0 auto !important;

    div[style*="text-align: justify;"] {
      text-align: justify !important;

<script>
  // Keep the navbar (and the mobile burger menu) visible while scrolling down:
  // Quarto's headroom.js would otherwise hide it until the reader scrolls up.
  if (window.Headroom) {
    window.Headroom.prototype.shouldUnpin = function () { return false; };
  }

  // Automatically roll back (collapse) the mobile burger menu after clicking any link
  (function () {
    function setupNavAutoClose() {
      var navCollapse = document.getElementById('navbarCollapse');
      var toggler = document.querySelector('.navbar-toggler');
      if (!navCollapse || !toggler) return;

      navCollapse.addEventListener('click', function (e) {
        var link = e.target.closest('a');
        if (!link) return;

        // Check if on mobile view (toggler button is visible) and menu is open
        var togglerVisible = window.getComputedStyle(toggler).display !== 'none';
        var isMenuOpen = navCollapse.classList.contains('show') || toggler.getAttribute('aria-expanded') === 'true';

        if (togglerVisible && isMenuOpen) {
          // Delay slightly so the link navigation / hashchange begins smoothly
          setTimeout(function () {
            if (navCollapse.classList.contains('show')) {
              toggler.click();

              // Fallback safety: ensure class is removed if toggler event was stopped
              setTimeout(function () {
                if (navCollapse.classList.contains('show')) {
                  navCollapse.classList.remove('show');
                  toggler.setAttribute('aria-expanded', 'false');
                  toggler.classList.add('collapsed');
                }
              }, 350);
            }
          }, 60);
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupNavAutoClose);
    } else {
      setupNavAutoClose();
    }
  })();
</script>

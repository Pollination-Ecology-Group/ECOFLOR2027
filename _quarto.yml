project:
  output-dir: ./docs
  type: website
  render:
    - "*.qmd"
    - "!archive/"
    - "!Ecoflor_2026_Book_of_abstracts.qmd"
  resources:
    - "images/bluesky.svg"
    - "documents"
  post-render:
    - cp googleb16326ba55692535.html docs/googleb16326ba55692535.html
  
website:
  title: "ECOFLOR 2027 – Praha"
  page-navigation: true
  navbar:
    logo: "./images/logos/logo2027.png"
    logo-alt: "ECOFLOR 2027 Praha"
    background: "#5B9E9E"
    foreground: "white"
    left:
      - href: index.qmd#about
        text: "About" 
      - href: index.qmd#registration
        text: "Registration"     
      - href: index.qmd#programme
        text: "Programme"
      - href: index.qmd#speakers
        text: "Speakers"
      - href: index.qmd#excursion
        text: "Excursion"
      - href: index.qmd#venue
        text: "Venue" 
      - href: index.qmd#organisation
        text: "Organisation"  
      - href: index.qmd#contact
        text: "Contact"
    right:
      - icon: github
        href: https://github.com/Pollination-Ecology-Group/ECOFLOR2027
      - icon: envelope
        href: mailto:ecoflor2027@gmail.com
        
  page-footer: 
    left: "ECOFLOR 2027 – Praha | Made by Jakub Štenc" 
    right: 
      - icon: github
        href: https://github.com/Pollination-Ecology-Group/ECOFLOR2027
      - icon: envelope
        href: mailto:ecoflor2027@gmail.com

  announcement:
    icon: info-circle
    dismissable: true
    content: "🌸 **ECOFLOR 2027** – 3–6 February 2027, Praha. Registration opens soon!"
    type: light
    position: below-navbar

  back-to-top-navigation: true
  cookie-consent: true

format:
  html:
    fontsize: 1.1rem
    monofont: Fira Code
    highlight-style: arrow
    css: [custom_theme.scss]
    toc: true
    smooth-scroll: true
    code-overflow: scroll
    linkcolor: "#2A8A8A"
    background: "#F8FAFA"
    theme: cosmo